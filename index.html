<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WINAPP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="assets/logo.png" alt="WINAPP logo" />
          <div>
            <p class="brand-title">WINAPP</p>
            <p class="brand-subtitle">Live dashboard</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" id="open-batches">Batches</button>
          <div class="status-pill" id="last-refresh">Waiting for data</div>
        </div>
      </header>

      <main class="content">
        <section class="hero">
          <h1>Orders overview</h1>
          <p>Track every school order from intake to delivery.</p>
        </section>

        <section class="tabs" id="status-tabs"></section>

        <section class="table-card">
          <div class="table-header">
            <h2 id="table-title">New orders</h2>
            <button class="ghost-button" id="refresh-btn">Refresh</button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>
                    <input type="checkbox" id="select-all-orders" aria-label="Select all orders" />
                  </th>
                  <th>Order #</th>
                  <th>School</th>
                  <th>School ID</th>
                  <th>Order date</th>
                  <th>Status</th>
                  <th>Assigned</th>
                  <th>Batch</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="orders-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Info</h3>
          <button class="ghost-button" id="modal-close">Close</button>
        </div>
        <div class="modal-body">
          <p id="modal-message"></p>
          <div class="modal-table hidden" id="modal-table"></div>
        </div>
      </div>
    </div>

    <div class="loading-backdrop hidden" id="loading-backdrop">
      <div class="loading-card">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
